# .golangci.yml
version: "2"

linters:
  default: standard
  enable:
    - govet          # Ищет подозрительные конструкции (Printf, unreachable code)
    - staticcheck    # Мощный статический анализатор (замена go vet на стероидах)
    - ineffassign    # Находит присваивания, которые не используются
    - unused         # Находит неиспользуемые переменные, функции, типы
    - gocyclo        # Проверяет сложность функций (цикломатическая)
    - misspell       # Находит опечатки в комментариях
    - revive         # Очень гибкий линтер, замена golint (проверяет именование, комментарии)
    - gocritic       # Проверяет на ошибки, проблемы с производительностью и стилем
    - whitespace     # Проверяет лишние пробелы в начале/конце строк
    - godot          # Проверяет, что комментарии заканчиваются точкой

  settings:
    gocyclo:
      # Максимальная цикломатическая сложность функции
      min-complexity: 15
    misspell:
      locale: US
    revive:
      severity: warning
      rules:
        - name: exported
          severity: warning
          disabled: false

formatters:
  # Включаем форматтеры, которые не просто проверяют, но и могут исправлять
  enable:
    - gofmt          # Основной форматтер Go (проверяет отступы, пробелы)
    - gofumpt        # Более строгая версия gofmt (приводит код к единому красивому стилю)[citation:4]
    - golines        # Форматирует длинные строки, разбивая их на несколько[citation:7]

  settings:
    golines:
      # Максимальная длина строки (100 — стандарт для Go)
      max-len: 100

issues:
  # Ограничиваем количество одинаковых ошибок в выводе, чтобы не засорять лог
  max-same-issues: 50