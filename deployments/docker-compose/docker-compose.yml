services:
  postgres:
    image: postgres:16-alpine
    container_name: helmsman-postgres
    environment:
      POSTGRES_USER: helmsman
      POSTGRES_PASSWORD: helmsman
      POSTGRES_DB: helmsman
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U helmsman"]
      interval: 5s
      timeout: 5s
      retries: 5

  auth:
    build:
      context: ../../
      dockerfile: backend/auth/Dockerfile
    container_name: helmsman-auth
    ports:
      - "8081:8081"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: helmsman
      DB_PASSWORD: helmsman
      DB_NAME: helmsman
      JWT_SECRET: secret
    depends_on:
      postgres:
        condition: service_healthy

  storage:
    build:
      context: ../../
      dockerfile: backend/storage/Dockerfile
    container_name: helmsman-storage
    ports:
      - "8080:8080"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: helmsman
      DB_PASSWORD: helmsman
      DB_NAME: helmsman
    depends_on:
      postgres:
        condition: service_healthy

  topology:
    build:
      context: ../../
      dockerfile: backend/topology/Dockerfile
    container_name: helmsman-topology
    ports:
      - "8082:8082"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: helmsman
      DB_PASSWORD: helmsman
      DB_NAME: helmsman

  provisioner:
    build:
      context: ../../
      dockerfile: backend/provisioner/Dockerfile
    container_name: helmsman-provisioner
    ports:
      - "8083:8083"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: helmsman
      DB_PASSWORD: helmsman
      DB_NAME: helmsman

  executor:
    build:
      context: ../../
      dockerfile: backend/executor/Dockerfile
    container_name: helmsman-executor
    ports:
      - "8084:8084"

  catalog:
    build:
      context: ../../
      dockerfile: backend/catalog/Dockerfile
    container_name: helmsman-catalog
    ports:
      - "8085:8085"

  api-gateway:
    build:
      context: ../../
      dockerfile: backend/api-gateway/Dockerfile
    container_name: helmsman-api-gateway
    ports:
      - "8000:8000"
    environment:
      JWT_SECRET: secret
    depends_on:
      - auth
      - storage
      - topology
      - provisioner
      - executor
      - catalog

volumes:
  postgres_data:
